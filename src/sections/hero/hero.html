<!-- Seção Hero / Header -->
<header class="main-header">
    <div class="header-container">
        <a href="#" class="logo-link">
            <img src="logo.webp" alt="VÖRA Logo" class="header-logo">
        </a>
        <nav class="main-nav">
            <a href="#servicos" class="nav-item">Serviços</a>
            <a href="#manifesto" class="nav-item">Manifesto</a>
            <a href="#portfolio" class="nav-item">Antes & Depois</a>
            <a href="#cuidados" class="nav-item">Cuidados</a>
            <a href="#faq" class="nav-item">FAQ</a>
        </nav>
        <div class="header-cta">
            <a href="#agendamento" class="btn-header-booking" data-magnetic>
                <span class="btn-text-magnetic">Agendar</span>
            </a>
        </div>
        
        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" aria-label="Abrir Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>

<section id="hero" class="hero-section">
    <!-- Fundo de vídeo -->
    <div class="video-background-container">
        <video class="video-bg" autoplay loop muted playsinline>
            <source src="video-hero.mp4" type="video/mp4">
            Seu navegador não suporta vídeos HTML5.
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Conteúdo da Hero -->
    <div class="hero-content-wrapper container">
        <div class="hero-text-content">
            <h1 class="hero-title reveal-hero">
                O poder de um olhar marcante, <br>
                <span class="italic-serif">a praticidade que você merece.</span>
            </h1>
            <p class="hero-subtitle reveal-hero reveal-hero-delay-1">
                Extensões de cílios premium que aliam biossegurança rigorosa a um design personalizado e exclusivo nos Jardins.
            </p>
            <div class="hero-cta-container reveal-hero reveal-hero-delay-2">
                <a href="#agendamento" class="btn-primary btn-hero-booking" data-magnetic>
                    <span class="btn-text-magnetic">Agendar Meu Horário</span>
                </a>
            </div>
        </div>
    </div>
    
    <!-- Indicador de scroll de luxo -->
    <div class="scroll-indicator-container">
        <a href="#servicos" class="scroll-indicator">
            <span class="scroll-text">Descubra</span>
            <div class="scroll-line-container">
                <span class="scroll-line"></span>
            </div>
        </a>
    </div>
</section>
